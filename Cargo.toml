[package]
name = "basis-lab"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Fast cross-venue OHLC premium and discount explorer"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["http2", "json", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
futures = "0.3"
http = "1"
moka = { version = "0.12", features = ["future"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6", features = ["compression-gzip", "cors", "fs", "limit", "request-id", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
approx = "0.5"
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

